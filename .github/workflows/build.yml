# Builds every Valence package:
#   Windows  setup .exe (NSIS) and .msi
#   macOS    Valence.app, zipped, for Apple Silicon and Intel (ad-hoc signed, no Developer ID)
#   Linux    AppImage
#   Android  ARM and x86 APKs
#
# Runs when you start it from the Actions tab (where "Only" can limit it to one platform), for
# version tags (v*), and as part of the Nightly workflow (nightly.yml), which calls it with a nightly
# version. A tag builds everything and gathers it into a draft GitHub release to look over before
# publishing.
#
# The repo is private, so runs use the account's Actions minutes, and macOS minutes count 10x and
# Windows 2x. That's why this doesn't run on every push.

name: Build

on:
  workflow_dispatch:
    inputs:
      only:
        description: Build only one platform
        type: choice
        options: [all, windows, macos, linux, android]
        default: all
  workflow_call:
    inputs:
      only:
        description: '"all", or platforms separated by commas (windows, macos, linux, android)'
        type: string
        default: all
      version:
        description: Version for the packages (e.g. 0.1.0-nightly.20261105); empty keeps package.json's
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # The workflow name keeps a manual Build and the Nightly's call to this file from cancelling each other.
  group: ${{ github.workflow }}-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Pick platforms
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.pick.outputs.desktop }}
      android: ${{ steps.pick.outputs.android }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only || 'all' }} # a tag push has no input: build everything
        run: |
          # One entry per desktop build. The native modules (better-sqlite3, sharp, ffmpeg-static)
          # install for the machine doing the build, so each platform builds on its own runner.
          #
          # Both Macs build in one job on Intel, so a run needs one Mac runner: GitHub's Apple Silicon
          # runners never picked our jobs up (capacity), and in US daytime even Intel ones can take
          # 10+ minutes, or drop a job after 15. The job packages the Intel app, then swaps in the
          # arm64 native modules ("cross") and packages the Apple Silicon one, checking that each has
          # only binaries for its CPU. macos-15-intel is GitHub's last Intel image; when it retires,
          # flip this around (arm64 runner, cross-build Intel).
          desktop='[
            {"platform": "windows", "name": "Windows (EXE, MSI)", "os": "windows-latest", "artifact": "valence-windows",
             "targets": "--win nsis msi --x64", "files": "release/*-Setup-*.exe\nrelease/*.msi", "fetch": ""},
            {"platform": "macos", "name": "macOS (Apple Silicon, Intel)", "os": "macos-15-intel", "artifact": "valence-macos",
             "targets": "--mac zip --x64", "files": "release/*.zip", "fetch": "--all", "cross": "arm64"},
            {"platform": "linux", "name": "Linux (AppImage)", "os": "ubuntu-latest", "artifact": "valence-linux",
             "targets": "--linux AppImage --x64", "files": "release/*.AppImage", "fetch": ""}
          ]'
          # ONLY is "all" or a comma list such as "windows,linux,android".
          echo "desktop=$(jq -c --arg only "$ONLY" '[.[] | select($only == "all" or (.platform as $p | $only | split(",") | any(.[]; . == $p)))]' <<< "$desktop")" >> "$GITHUB_OUTPUT"
          case ",$ONLY," in *,all,*|*,android,*) echo "android=true" >> "$GITHUB_OUTPUT" ;; *) echo "android=false" >> "$GITHUB_OUTPUT" ;; esac

  desktop:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.desktop != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch fpcalc
        run: node scripts/fetch-binaries.mjs ${{ matrix.fetch }}

      - name: Build the app
        run: npm run build

      # A nightly version (0.1.0-nightly.20261105) goes into the app and the file names. Windows
      # installers need a numeric version, so they get 0.1.0.<run number>, and each nightly MSI
      # upgrades the last.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx electron-builder ${{ matrix.targets }} --publish never ${VERSION:+-c.extraMetadata.version=$VERSION}

      - name: Check the Intel app
        if: runner.os == 'macOS'
        run: scripts/ci-mac-check.sh release/mac/Valence.app x86_64

      # Now the Apple Silicon app: reinstall the native packages for arm64. npm's --cpu picks sharp's
      # arm64 build, npm_config_arch makes ffmpeg-static download its arm64 binary, and electron-builder
      # rebuilds better-sqlite3 for arm64 itself. The code built above is reused.
      - name: Swap in ${{ matrix.cross }} native modules
        if: matrix.cross
        env:
          npm_config_arch: ${{ matrix.cross }}
        run: npm ci --cpu=${{ matrix.cross }} --os=darwin

      - name: Package for ${{ matrix.cross }}
        if: matrix.cross
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx electron-builder --mac zip --${{ matrix.cross }} --publish never ${VERSION:+-c.extraMetadata.version=$VERSION}

      - name: Check the Apple Silicon app
        if: matrix.cross
        run: scripts/ci-mac-check.sh release/mac-arm64/Valence.app arm64

      # Kept a week: releases hold their own copies, and artifacts count against the account's
      # Actions storage.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Android (ARM, x86)
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      # Optional: this PC's debug keystore, base64-encoded. Release builds are signed with the debug
      # key, so with it the APKs update the copy already on your phone; without it each run signs
      # with a throwaway key and Android will refuse to install over an existing copy.
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Use your signing key
        if: env.ANDROID_DEBUG_KEYSTORE != ''
        run: |
          mkdir -p ~/.android
          echo "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore

      - name: Test the shared core
        run: ./gradlew :core:test

      # A nightly version only changes the version name: the version code stays put, so your own
      # builds and nightlies keep installing over each other.
      - name: Build the APKs
        run: |
          version=${VERSION:-$(sed -n 's/.*versionName = .*"\([0-9][^"]*\)".*/\1/p' app/build.gradle.kts)}
          mkdir -p dist
          ./gradlew :app:assembleRelease -Pabis=arm64-v8a,armeabi-v7a -PversionName="$version"
          cp app/build/outputs/apk/release/app-release.apk "dist/Valence-$version-arm.apk"
          ./gradlew :app:assembleRelease -Pabis=x86,x86_64 -PversionName="$version"
          cp app/build/outputs/apk/release/app-release.apk "dist/Valence-$version-x86.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: valence-android
          path: android/dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
