appId: local.valence.app
productName: Valence
directories:
  output: release
  buildResources: resources/icons
files:
  - out/**/*
  - package.json
  - resources/icons/*.png
  - resources/seasons/*.jpg
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/ffmpeg-static/**/*"
extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin
    filter: ["**/*"]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
# Built by CI (`--win nsis msi`); local `npm run dist:win` keeps to the setup and portable exes.
msi:
  oneClick: false
  perMachine: false
  artifactName: ${productName}-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.music
  icon: resources/icons/icon.png
  # No Developer ID: ad-hoc signed, which Apple Silicon needs to run the app at all. Hardened
  # runtime would reject Electron's own frameworks under an ad-hoc signature, so it's off.
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - rpm
    - pacman
  category: Audio
  icon: resources/icons/icon.png
  maintainer: Valence
